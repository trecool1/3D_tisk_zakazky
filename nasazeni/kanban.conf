# Kanban zakázek — statika + PHP z /var/www/kanban
# Port 8091; ven přes cloudflared (Public hostname -> http://localhost:8091), jako kalkulátor.
# Nahrazuje původní kanban.conf (jen statika pro prototyp).
server {
    listen 8091;
    listen [::]:8091;
    server_name _;

    root /var/www/kanban;
    index index.html;

    charset utf-8;
    client_max_body_size 210m;   # ruční přílohy v detailu zakázky (limit ~200 MB/soubor + režie multipartu)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    access_log /var/log/nginx/kanban-access.log;
    error_log  /var/log/nginx/kanban-error.log;

    # interní soubory ven nepustit
    location ~* \.(log|md|sqlite|sqlite-wal|sqlite-shm)$ { deny all; }
    location ~ /\.                                       { deny all; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-kanban.sock;
        fastcgi_read_timeout 300s;   # velké přílohy přes pomalejší linku
    }

    # hezká adresa stavové stránky: /stav/<token>
    # POZOR: ne snippets/fastcgi-php.conf — jeho `try_files $fastcgi_script_name =404`
    # by hledal soubor /stav/<token> a vrátil 404. Bereme jen základní fastcgi.conf.
    location ~ ^/stav/([\w-]+)$ {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-kanban.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/stav.php;
        fastcgi_param SCRIPT_NAME     /stav.php;
        fastcgi_param QUERY_STRING    t=$1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
