# Kanban zakázek — statika + PHP z /var/www/kanban
# Port 8091; ven přes cloudflared (Public hostname -> http://localhost:8091), jako kalkulátor.
# Nahrazuje původní kanban.conf (jen statika pro prototyp).
server {
    listen 8091;
    listen [::]:8091;
    server_name _;

    root /var/www/kanban;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;
    access_log /var/log/nginx/kanban-access.log;
    error_log  /var/log/nginx/kanban-error.log;

    # interní soubory ven nepustit
    location ~* \.(log|md|sqlite|sqlite-wal|sqlite-shm)$ { deny all; }
    location ~ /\.                                       { deny all; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-kanban.sock;
        fastcgi_read_timeout 120s;
    }

    # hezká adresa stavové stránky: /stav/<token>
    location ~ ^/stav/([\w-]+)$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-kanban.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/stav.php;
        fastcgi_param QUERY_STRING    t=$1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
