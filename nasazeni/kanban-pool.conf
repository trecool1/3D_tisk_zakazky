; PHP-FPM pool pro kanban zakázek — běží pod uživatelem cadmia,
; stejně jako kalkulátor, aby šlo psát do /var/www/kanban-data (SQLite, modely).
; Cíl: /etc/php/8.3/fpm/pool.d/kanban.conf
[kanban]
user = cadmia
group = cadmia
listen = /run/php/php8.3-fpm-kanban.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
php_admin_value[upload_max_filesize] = 200M
php_admin_value[post_max_size] = 210M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
